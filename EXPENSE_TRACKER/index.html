<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spending</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172033">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#eceff4;--card:#fff;--tx:#172033;--mut:#5f6b80;--bd:#dde2ea;--ac:#3d4fd6;--ok:#138a72;--warn:#d98a1f;--bad:#cf3f55}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#181f2e;--tx:#e8ecf5;--mut:#94a0b8;--bd:#2a3347;--ac:#8b9bff;--ok:#4cc2a5;--warn:#f0b050;--bad:#ff7a8c}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;line-height:1.4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:1rem;margin:0 0 10px;font-weight:650}
input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0}
input,select{width:100%}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:650}
.g{background:none;border-color:transparent;color:var(--mut)}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.r>*{flex:1 1 120px}
.r>.n{flex:0 0 auto}
.mut{color:var(--mut);font-size:.85rem}
nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
nav b{font-size:1.1rem}
nav button{flex:none;padding:6px 12px}
#sync{font-size:.8rem;padding:4px 10px;border-radius:20px}
.big{font-size:2.6rem;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.track{position:relative;height:14px;background:var(--bd);border-radius:8px;margin:14px 0 6px}
.track i{display:block;height:100%;border-radius:8px;background:var(--ok);transition:width .3s}
.tick{position:absolute;top:-5px;width:2px;height:24px;background:var(--tx);border-radius:1px}
.tick span{position:absolute;top:26px;left:-14px;font-size:.7rem;color:var(--mut)}
.msg{padding:9px 12px;border-radius:10px;margin-top:22px;font-size:.9rem;border:1px solid var(--bd)}
.msg.warn{border-color:var(--warn)}.msg.bad{border-color:var(--bad)}.msg.ok{border-color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:14px}
.grid div{background:var(--bg);border-radius:10px;padding:9px 11px}
.grid b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1}
.seg .on,.tabs .on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{padding:6px 12px;font-size:.85rem}
.bl{margin:9px 0}.bl div:first-child{display:flex;justify-content:space-between;font-size:.9rem}
.bl .t{height:7px;background:var(--bd);border-radius:5px;margin-top:3px}.bl .t i{display:block;height:100%;background:var(--ac);border-radius:5px}
.chart{display:flex;align-items:flex-end;gap:2px;height:70px;margin-top:6px}
.chart i{flex:1;background:var(--ac);border-radius:2px 2px 0 0;min-height:2px;opacity:.8}
.it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer}
.it:first-child{border-top:0}
.it b{font-variant-numeric:tabular-nums;white-space:nowrap}
.income{color:var(--ok)}.investment{color:var(--ac)}
details summary{cursor:pointer;font-weight:650}
label{display:block}label span{display:block;margin-bottom:3px}
.hide{display:none!important}
</style>
</head>
<body>
<main>
<nav>
<button id="prev" class="g" aria-label="Previous month">‹</button>
<div style="text-align:center"><b id="mlabel"></b><br><button id="sync" class="g"></button></div>
<button id="next" class="g" aria-label="Next month">›</button>
</nav>

<section class="card" id="formcard">
<h2 id="ftitle">Add entry</h2>
<div class="seg" id="seg">
<button data-t="expense" class="on">Expense</button><button data-t="income">Income</button><button data-t="investment">Investment</button>
</div>
<div class="r" style="margin-bottom:8px">
<input id="amt" type="number" inputmode="decimal" step="0.01" placeholder="Amount (€)" aria-label="Amount">
<input id="date" type="date" class="hide" aria-label="Date"><button id="dbtn" type="button" class="n">Today ▾</button>
</div>
<div class="r" style="margin-bottom:8px">
<select id="cat" aria-label="Category"></select>
<select id="nat" aria-label="Nature"></select>
<select id="acc" aria-label="Account"></select>
</div>
<div class="r" style="margin-bottom:10px">
<input id="ven" list="vl" placeholder="Vendor" aria-label="Vendor"><datalist id="vl"></datalist>
<input id="note" placeholder="Comment" aria-label="Comment">
</div>
<div class="r">
<button class="p" id="add">Add entry</button>
<button id="cancel" class="hide">Cancel</button>
<button id="del" class="hide" style="color:var(--bad)">Delete</button>
</div>
</section>

<section class="card" id="hero">
<div class="mut">Spent this month</div>
<div class="big" id="spent"></div>
<div class="track"><i id="bar"></i><div class="tick" id="tick"><span>today</span></div></div>
<div class="mut" id="pline"></div>
<div id="alert"></div>
<div class="grid" id="stats"></div>
</section>

<section class="card">
<h2>Breakdown</h2>
<div class="tabs" id="tabs"><button data-m="category" class="on">Category</button><button data-m="nature">Nature</button><button data-m="account">Account</button><button data-m="vendor">Vendor</button></div>
<div id="bars"></div>
<div class="mut" style="margin-top:10px">Expenses per day</div>
<div class="chart" id="chart"></div>
</section>

<section class="card">
<div class="r" style="margin-bottom:6px"><h2 style="margin:0">Entries</h2>
<select id="flt" class="n" style="width:auto"><option value="all">All</option><option value="expense">Expenses</option><option value="income">Income</option><option value="investment">Investments</option></select></div>
<div id="list"></div>
</section>

<section class="card">
<h2>Export</h2>
<div class="r"><button id="xm">This month (.xlsx)</button><button id="xa">Everything (.xlsx)</button></div>
</section>

<section class="card">
<details id="setup"><summary>Settings and GitHub sync</summary>
<div class="r" style="margin-top:12px">
<label><span class="mut">Monthly budget (€)</span><input id="sB" type="number" inputmode="decimal"></label>
<label><span class="mut">Safety net limit (€)</span><input id="sN" type="number" inputmode="decimal"></label>
</div>
<label style="margin-top:8px"><span class="mut">Accounts (comma separated)</span><input id="sA"></label>
<label style="margin-top:8px"><span class="mut">Expense categories</span><input id="sCe"></label>
<label style="margin-top:8px"><span class="mut">Income categories</span><input id="sCi"></label>
<label style="margin-top:8px"><span class="mut">Investment categories</span><input id="sCv"></label>
<label style="margin-top:8px"><span class="mut">Nature of spending</span><input id="sNa"></label>
<h2 style="margin-top:16px">GitHub (private data repo)</h2>
<div class="r">
<label><span class="mut">Username</span><input id="gO" autocapitalize="none" autocomplete="off"></label>
<label><span class="mut">Repository name</span><input id="gR" autocapitalize="none" autocomplete="off"></label>
</div>
<label style="margin-top:8px"><span class="mut">Access token (stays on this phone)</span><input id="gT" type="password" autocomplete="off"></label>
<div class="r" style="margin-top:12px"><button class="p" id="save">Save and sync</button></div>
</details>
</section>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var LS="spend.v1";
var DEF={budget:2000,net:2500,accounts:["TF Bank","Cash"],natures:["Essential","Leisure","Occasional"],
cats:{expense:["Groceries","Dining","Housing & bills","Transport","Shopping","Clothes","Health","Leisure","Travel","Other"],income:["Salary","Dividends","Interest","Other"],investment:["ETF","Stocks","Crypto","Pension","Other"]}};
var S={};try{S=JSON.parse(localStorage.getItem(LS))||{}}catch(e){}
S.cfg=S.cfg||{};S.months=S.months||{};S.remote=S.remote||[];S.set=Object.assign({},DEF,S.set||{});
var dateOn=false,fresh={},setLoaded=false,editing=null,type="expense",mode="category",mon=null,busy=false;
var pad=function(n){return String(n).padStart(2,"0")};
var iso=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var today=new Date(),thisM=iso(today).slice(0,7);mon=thisM;
var eur=function(n){return new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(n)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function shift(ym,d){var p=ym.split("-").map(Number),dt=new Date(p[0],p[1]-1+d,1);return dt.getFullYear()+"-"+pad(dt.getMonth()+1)}
function ents(ym){return S.months[ym]?S.months[ym].e:[]}
function allEnts(){var o=[];Object.keys(S.months).forEach(function(k){o=o.concat(S.months[k].e)});return o}
function ensure(ym){if(!S.months[ym])S.months[ym]={e:[],sha:null,dirty:false};return S.months[ym]}

/* ---------- GitHub ---------- */
var ready=function(){var c=S.cfg;return !!(c.owner&&c.repo&&c.token)};
function gh(path,method,body){var c=S.cfg;
 return fetch("https://api.github.com/repos/"+encodeURIComponent(c.owner)+"/"+encodeURIComponent(c.repo)+"/contents/"+path,
 {method:method||"GET",headers:{"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github+json"},body:body?JSON.stringify(body):undefined})}
function dec(b){return new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,"")),function(c){return c.charCodeAt(0)}))}
function enc(s){var t="";new TextEncoder().encode(s).forEach(function(x){t+=String.fromCharCode(x)});return btoa(t)}
async function pull(path){var r=await gh(path);if(r.status===404)return{none:true};if(!r.ok)throw new Error(r.status);
 var j=await r.json();return{sha:j.sha,data:JSON.parse(dec(j.content))}}
async function push(path,obj,sha){
 for(var i=0;i<2;i++){
  var r=await gh(path,"PUT",{message:"update "+path,content:enc(JSON.stringify(obj,null,1)),sha:sha||undefined});
  if(r.ok){var j=await r.json();return j.content.sha}
  if((r.status===409||r.status===422)&&i===0){var f=await pull(path);sha=f.none?null:f.sha;continue}
  throw new Error(r.status)}}
function mergeInto(m,rd){var del={},map={};
 (m.del||[]).concat(rd.deleted||[]).forEach(function(x){del[x.id]=x});
 (rd.entries||[]).concat(m.e).forEach(function(e){var o=map[e.id];if(!o||(e.upd||e.ts)>=(o.upd||o.ts))map[e.id]=e});
 m.del=Object.keys(del).map(function(k){return del[k]});
 m.e=Object.keys(map).filter(function(k){return !del[k]}).map(function(k){return map[k]})}
async function pushMonth(ym){
 var m=S.months[ym],path="expenses/"+ym+".json";
 for(var i=0;i<4;i++){
  var r=await gh(path,"PUT",{message:"update "+path,content:enc(JSON.stringify({month:ym,entries:m.e,deleted:m.del||[]},null,1)),sha:m.sha||undefined});
  if(r.ok){m.sha=(await r.json()).content.sha;m.dirty=false;return}
  if(r.status===409||r.status===422){var f=await pull(path);if(f.none){m.sha=null}else{mergeInto(m,f.data);m.sha=f.sha}continue}
  throw new Error(r.status)}
 throw new Error("conflict")}
async function pullMonth(ym){
 var m=ensure(ym),r=await pull("expenses/"+ym+".json");
 if(m.dirty)return;
 if(r.none){m.sha=null}else{m.e=r.data.entries||[];m.del=r.data.deleted||[];m.sha=r.sha}
 fresh[ym]=1}
var chain=Promise.resolve(),timer;
function sync(){chain=chain.then(doSync).catch(function(){});return chain}
function queue(){clearTimeout(timer);timer=setTimeout(sync,600)}
function status(){var n=Object.keys(S.months).filter(function(k){return S.months[k].dirty}).length+(S.setDirty?1:0);
 var b=$("sync");
 if(!ready()){b.textContent="Saved on this phone only";b.style.color="var(--warn)"}
 else if(busy){b.textContent="Syncing…";b.style.color="var(--mut)"}
 else if(S.err){b.textContent="Not synced ("+S.err+"), tap to retry";b.style.color="var(--bad)"}
 else if(n){b.textContent=n+" change(s) waiting";b.style.color="var(--warn)"}
 else{b.textContent="Synced to GitHub ✓";b.style.color="var(--ok)"}}
async function doSync(){
 if(!ready()){status();return}
 busy=true;S.err="";status();
 try{
  if(S.setDirty){S.setSha=await push("settings.json",S.set,S.setSha);S.setDirty=false}
  else if(!setLoaded){var r=await pull("settings.json");
   if(r.none){S.setDirty=true;S.setSha=await push("settings.json",S.set,null);S.setDirty=false}
   else{S.set=Object.assign({},DEF,r.data);S.setSha=r.sha}
   setLoaded=true;fillSettings()}
  var ks=Object.keys(S.months);
  for(var i=0;i<ks.length;i++){var m=S.months[ks[i]];
   if(m.dirty)await pushMonth(ks[i]);}
  var d=await gh("expenses");if(d.ok){var l=await d.json();S.remote=l.map(function(x){return x.name.slice(0,7)})}
  var want=[mon,thisM];
  for(var j=0;j<want.length;j++){if(!fresh[want[j]])await pullMonth(want[j])}
 }catch(e){S.err=String(e.message||e)}
 busy=false;persist();status();render()}

/* ---------- form ---------- */
function opts(el,arr,keep){var v=keep||el.value;el.innerHTML=arr.map(function(x){return"<option>"+esc(x)+"</option>"}).join("");if(arr.indexOf(v)>-1)el.value=v}
function setType(t){type=t;
 Array.prototype.forEach.call($("seg").children,function(b){b.classList.toggle("on",b.dataset.t===t)});
 opts($("cat"),S.set.cats[t]);$("nat").classList.toggle("hide",t!=="expense");
 opts($("nat"),S.set.natures);opts($("acc"),S.set.accounts)}
function vendors(){var s={};allEnts().forEach(function(e){if(e.vendor)s[e.vendor]=1});
 $("vl").innerHTML=Object.keys(s).sort().map(function(v){return'<option value="'+esc(v)+'">'}).join("")}
$("ven").addEventListener("change",function(){
 if(editing)return;var v=this.value.trim().toLowerCase(),f=null;
 allEnts().forEach(function(e){if(e.vendor&&e.vendor.toLowerCase()===v&&e.type===type&&(!f||e.ts>f.ts))f=e});
 if(f){$("cat").value=f.category;if(f.nature)$("nat").value=f.nature;$("acc").value=f.account}});
function setDate(on,v){dateOn=on;$("date").classList.toggle("hide",!on);$("dbtn").classList.toggle("hide",on);if(on)$("date").value=v||iso(new Date())}
$("dbtn").onclick=function(){setDate(true)};
function resetForm(){editing=null;$("amt").value="";$("ven").value="";$("note").value="";setDate(false);
 $("ftitle").textContent="Add entry";$("add").textContent="Add entry";$("cancel").classList.add("hide");$("del").classList.add("hide")}
function findEntry(id){var ks=Object.keys(S.months);for(var i=0;i<ks.length;i++){var m=S.months[ks[i]];
 for(var j=0;j<m.e.length;j++)if(m.e[j].id===id)return{ym:ks[i],i:j,e:m.e[j]}}return null}
$("add").onclick=function(){
 var a=parseFloat($("amt").value);if(!(a>0)){$("amt").focus();return}
 var date=dateOn?($("date").value||iso(new Date())):iso(new Date()),old=editing?findEntry(editing):null;
 var e={id:old?old.e.id:Date.now()+Math.random().toString(36).slice(2,5),ts:old?old.e.ts:Date.now(),upd:Date.now(),date:date,type:type,amount:Math.round(a*100)/100,
  category:$("cat").value,nature:type==="expense"?$("nat").value:"",account:$("acc").value,vendor:$("ven").value.trim(),note:$("note").value.trim(),source:old?old.e.source:"manual"};
 var nm=date.slice(0,7);
 if(old){var om=S.months[old.ym];om.e.splice(old.i,1);om.dirty=true;if(old.ym!==nm)(om.del=om.del||[]).push({id:e.id})}
 var m=ensure(nm);m.del=(m.del||[]).filter(function(x){return x.id!==e.id});m.e.push(e);m.dirty=true;
 var keepAcc=$("acc").value;resetForm();$("acc").value=keepAcc;persist();render();queue()};
$("cancel").onclick=function(){resetForm()};
$("del").onclick=function(){var o=editing&&findEntry(editing);if(!o||!confirm("Delete this entry?"))return;
 var dm=S.months[o.ym];dm.e.splice(o.i,1);(dm.del=dm.del||[]).push({id:o.e.id});dm.dirty=true;resetForm();persist();render();queue()};
$("seg").onclick=function(ev){if(ev.target.dataset.t)setType(ev.target.dataset.t)};
$("amt").addEventListener("keydown",function(e){if(e.key==="Enter")$("add").click()});
function edit(id){var o=findEntry(id);if(!o)return;var e=o.e;editing=id;setType(e.type);
 $("amt").value=e.amount;setDate(e.date!==iso(new Date()),e.date);$("cat").value=e.category;if(e.nature)$("nat").value=e.nature;
 $("acc").value=e.account;$("ven").value=e.vendor||"";$("note").value=e.note||"";
 $("ftitle").textContent="Edit entry";$("add").textContent="Save changes";$("cancel").classList.remove("hide");$("del").classList.remove("hide");
 $("formcard").scrollIntoView({behavior:"smooth"})}

/* ---------- dashboard ---------- */
function bars(map,total){var ks=Object.keys(map).sort(function(a,b){return map[b]-map[a]}),el=$("bars");
 if(!ks.length){el.innerHTML='<div class="mut">No expenses yet this month. Add your first one above.</div>';return}
 el.innerHTML=ks.slice(0,12).map(function(k){return'<div class="bl"><div><span>'+esc(k||"None")+'</span><span>'+eur(map[k])+" · "+Math.round(map[k]/total*100)+'%</span></div><div class="t"><i style="width:'+(map[k]/map[ks[0]]*100)+'%"></i></div></div>'}).join("")}
function render(){
 var p=mon.split("-").map(Number),dim=new Date(p[0],p[1],0).getDate(),isCur=mon===thisM,day=isCur?today.getDate():dim;
 $("mlabel").textContent=new Date(p[0],p[1]-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
 var list=ents(mon),sum={expense:0,income:0,investment:0};
 list.forEach(function(e){sum[e.type]+=e.amount});
 var B=S.set.budget||0,N=S.set.net||0,exp=sum.expense,pace=isCur?day/dim:1,expd=B*pace;
 var avg=day?exp/day:0,proj=isCur?avg*dim:exp;
 $("spent").textContent=eur(exp);
 var bar=$("bar");bar.style.width=(B?Math.min(100,exp/B*100):0)+"%";
 bar.style.background=(N&&exp>N)?"var(--bad)":(B&&exp>B)?"var(--warn)":(B&&exp>expd)?"var(--warn)":"var(--ok)";
 $("tick").style.left=(pace*100)+"%";$("tick").classList.toggle("hide",!isCur||!B);
 $("pline").textContent=B?Math.round(exp/B*100)+"% of "+eur(B)+" budget, day "+day+" of "+dim:"";
 var a=$("alert"),cls="",t="";
 if(N&&exp>N){cls="bad";t="Past your safety net by "+eur(exp-N)+"."}
 else if(B&&exp>B){cls="warn";t="Over budget by "+eur(exp-B)+". Safety net has "+eur(N-exp)+" left."}
 else if(isCur&&N&&proj>N){cls="bad";t="At this pace you will end near "+eur(proj)+", above your safety net."}
 else if(isCur&&B&&proj>B){cls="warn";t="At this pace you will end near "+eur(proj)+", over budget."}
 else if(isCur&&B){cls="ok";t=exp<=expd?eur(expd-exp)+" under pace.":"Slightly ahead of pace, still within budget."}
 a.innerHTML=t?'<div class="msg '+cls+'">'+t+'</div>':"";
 var left=sum.income-exp-sum.investment,sr=sum.income>0?Math.round((sum.income-exp)/sum.income*100)+"%":"–";
 $("stats").innerHTML=[["Income",eur(sum.income)],["Invested",eur(sum.investment)],["Left over",eur(left)],["Savings rate",sr],
  ["Budget left",B?eur(B-exp):"–"],["Safety net left",N?eur(N-exp):"–"],["Daily average",eur(avg)],["Projected",eur(proj)]]
  .map(function(x){return'<div><span class="mut">'+x[0]+"</span><b>"+x[1]+"</b></div>"}).join("");
 var ex=list.filter(function(e){return e.type==="expense"}),map={};
 ex.forEach(function(e){var k=e[mode]||"";map[k]=(map[k]||0)+e.amount});bars(map,exp);
 var days=[];for(var i=0;i<dim;i++)days.push(0);ex.forEach(function(e){days[+e.date.slice(8,10)-1]+=e.amount});
 var mx=Math.max.apply(null,days.concat([1]));
 $("chart").innerHTML=days.map(function(v,i){return'<i style="height:'+(v/mx*100)+'%" title="Day '+(i+1)+": "+eur(v)+'"></i>'}).join("");
 var f=$("flt").value,rows=list.filter(function(e){return f==="all"||e.type===f}).sort(function(x,y){return y.date.localeCompare(x.date)||y.ts-x.ts});
 $("list").innerHTML=rows.length?rows.map(function(e){
  var sign=e.type==="income"?"+":e.type==="expense"?"−":"";

 vendors();status()}

function fillSettings(){var s=S.set,c=S.cfg;$("sB").value=s.budget;$("sN").value=s.net;$("sA").value=s.accounts.join(", ");
 $("sCe").value=s.cats.expense.join(", ");$("sCi").value=s.cats.income.join(", ");$("sCv").value=s.cats.investment.join(", ");

/* ---------- export ---------- */
function loadX(){return new Promise(function(res,rej){if(window.XLSX)return res();var s=document.createElement("script");
 s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function dl(blob,name){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
async function exportX(all){
 if(all&&ready()){for(var i=0;i<S.remote.length;i++){var k=S.remote[i];if(!fresh[k]&&!(S.months[k]&&S.months[k].dirty)){try{await pullMonth(k)}catch(e){}}}persist()}
 var list=(all?allEnts():ents(mon)).slice().sort(function(a,b){return a.date.localeCompare(b.date)||a.ts-b.ts});
 var head=["Date","Type","Amount","Category","Nature","Account","Vendor","Comment"],name="spending-"+(all?"all":mon);
 var rows=list.map(function(e){var p=e.date.split("-").map(Number);return[new Date(p[0],p[1]-1,p[2],12),e.type,e.amount,e.category,e.nature||"",e.account,e.vendor||"",e.note||""]});
 try{await loadX();var ws=XLSX.utils.aoa_to_sheet([head].concat(rows),{cellDates:true});
  rows.forEach(function(r,i){var c=ws["A"+(i+2)];if(c)c.z="yyyy-mm-dd"});
  ws["!cols"]=[{wch:11},{wch:11},{wch:10},{wch:16},{wch:11},{wch:12},{wch:18},{wch:24}];
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Transactions");
  dl(new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array",cellDates:true})],{type:"application/octet-stream"}),name+".xlsx")}
 catch(e){var q=function(v){return'"'+String(v).replace(/"/g,'""')+'"'};
  var t=[head.join(",")].concat(list.map(function(e){return[e.date,e.type,e.amount,q(e.category),q(e.nature||""),q(e.account),q(e.vendor||""),q(e.note||"")].join(",")})).join("\n");
  dl(new Blob(["\ufeff"+t],{type:"text/csv"}),name+".csv");alert("Excel library could not load (offline?). Saved as CSV instead, which Excel also opens.")}}
$("xm").onclick=function(){exportX(false)};$("xa").onclick=function(){exportX(true)};

sync();
